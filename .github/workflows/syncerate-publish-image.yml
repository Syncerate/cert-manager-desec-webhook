# Syncerate interim build: v0.1.4 plus upstream PR #30 (send SubName on deSEC
# RRset updates). Remove this fork once upstream releases the fix.
name: Syncerate publish patched image

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-syncerate.*"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/syncerate/cert-manager-desec-webhook
          tags: |
            type=ref,event=tag
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=cert-manager-desec-webhook (Syncerate interim build)
            org.opencontainers.image.description=pr0ton11/cert-manager-desec-webhook v0.1.4 with upstream PR #30 applied
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/syncerate/cert-manager-desec-webhook
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/syncerate/cert-manager-desec-webhook@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
